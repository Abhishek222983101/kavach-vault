# Keyless cloud backup for the Q-Day Drill. It holds NO private keys: only transactions that were signed beforehand
# (repository secrets HB_0..HB_2 and FREEZE_TX). It broadcasts the proof-of-life heartbeat if none has landed after the drill
# starts, and the guardian freeze if a critical anomaly shows on chain. It fails (and GitHub emails the owner) on a critical condition.
name: drill-keeper
on:
  schedule:
    - cron: "*/5 20-23 17 11 *"   # 17 Nov from 20:00 UTC
    - cron: "*/5 * 18 11 *"       # 18 Nov, the whole drill day (UTC)
    - cron: "*/10 0-6 19 11 *"    # 19 Nov until 06:59 UTC
  workflow_dispatch:
    inputs:
      dry:
        description: "Dry run: read state, never broadcast"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: drill-keeper
  cancel-in-progress: false
jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix cloud --no-audit --no-fund
      - name: Run the keeper
        env:
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry && '1' || '0' }}
          HB_0: ${{ secrets.HB_0 }}
          HB_1: ${{ secrets.HB_1 }}
          HB_2: ${{ secrets.HB_2 }}
          FREEZE_TX: ${{ secrets.FREEZE_TX }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: node cloud/keeper.mjs
