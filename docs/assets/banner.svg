<text x="290" y="132" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="68" font-weight="800" fill="#e6edf3" letter-spacing="2">KAVACH VAULT</text>
<text x="292" y="178" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" fill="#34d399">A stolen classical key moves nothing.</text>
<text x="292" y="216" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" fill="#8b98a5">Post-quantum signatures guard the vault. The drill account holds nothing and opens no window.</text>
<text x="292" y="252" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="17" fill="#60a5fa">QoreChain · Build Before Q-Day · Q-Day Drill</text>
