<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-label="Every road for the classical key ends at a refusal; money moves only with the post-quantum signature">
<rect width="1280" height="620" fill="#0b1117"/>
<text x="40" y="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#f87171">THE BOT: holds only the drill account's classical key</text>
<g><rect x="40" y="120" width="250" height="110" rx="12" fill="#111b24" stroke="#f87171" stroke-width="2"/><text x="165.0" y="171.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">The bot</text><text x="165.0" y="195.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">classical secp256k1 key, nothing else</text></g>
<g><rect x="430" y="50" width="440" height="74" rx="12" fill="#111b24" stroke="#60a5fa" stroke-width="2"/><text x="650.0" y="83.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Native lane</text><text x="650.0" y="107.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">needs the hybrid secp256k1 + ML-DSA-87 signature</text></g>
<g><rect x="430" y="142" width="440" height="74" rx="12" fill="#111b24" stroke="#60a5fa" stroke-width="2"/><text x="650.0" y="175.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">EVM lane</text><text x="650.0" y="199.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">needs an open window and a balance: the drill account has neither</text></g>
<g><rect x="430" y="234" width="440" height="74" rx="12" fill="#111b24" stroke="#60a5fa" stroke-width="2"/><text x="650.0" y="267.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Vault calls</text><text x="650.0" y="291.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">need an ML-DSA-87 signature the bot cannot make</text></g>
<g><rect x="430" y="326" width="440" height="74" rx="12" fill="#111b24" stroke="#60a5fa" stroke-width="2"/><text x="650.0" y="359.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Off-chain signatures</text><text x="650.0" y="383.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">permits and Permit2: the account holds nothing to permit</text></g>
<line x1="290" y1="160" x2="430" y2="87" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/></line><g transform="translate(360.0 123.5)"><circle r="15" fill="#0b1117" stroke="#f87171" stroke-width="3"><animate attributeName="r" values="15;18;15" dur="2s" begin="0s" repeatCount="indefinite"/></circle><path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#f87171" stroke-width="4" stroke-linecap="round"/></g><line x1="290" y1="170" x2="430" y2="179" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/></line><g transform="translate(360.0 174.5)"><circle r="15" fill="#0b1117" stroke="#f87171" stroke-width="3"><animate attributeName="r" values="15;18;15" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle><path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#f87171" stroke-width="4" stroke-linecap="round"/></g><line x1="290" y1="185" x2="430" y2="271" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/></line><g transform="translate(360.0 228.0)"><circle r="15" fill="#0b1117" stroke="#f87171" stroke-width="3"><animate attributeName="r" values="15;18;15" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle><path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#f87171" stroke-width="4" stroke-linecap="round"/></g><line x1="290" y1="200" x2="430" y2="363" stroke="#f87171" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/></line><g transform="translate(360.0 281.5)"><circle r="15" fill="#0b1117" stroke="#f87171" stroke-width="3"><animate attributeName="r" values="15;18;15" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle><path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#f87171" stroke-width="4" stroke-linecap="round"/></g>
<text x="960" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#f87171">All refused</text>
<text x="960" y="228" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#8b98a5">410 live attacks, 0 accepted</text>
<line x1="40" y1="428" x2="1240" y2="428" stroke="#1f2d3a" stroke-width="2"/>
<text x="40" y="462" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#34d399">THE ONLY ROAD TO THE MONEY: a signature from a key the bot does not have</text>
<g><rect x="40" y="490" width="230" height="96" rx="12" fill="#111b24" stroke="#34d399" stroke-width="2"/><text x="155.0" y="534.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Owner PQ key</text><text x="155.0" y="558.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">ML-DSA-87, kept offline</text></g>
<g><rect x="350" y="490" width="250" height="96" rx="12" fill="#111b24" stroke="#34d399" stroke-width="2"/><text x="475.0" y="534.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Signed request</text><text x="475.0" y="558.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">416 bytes, domain-separated</text></g>
<g><rect x="680" y="490" width="270" height="96" rx="12" fill="#111b24" stroke="#34d399" stroke-width="2"/><text x="815.0" y="534.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Hot vault</text><text x="815.0" y="558.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">about 15% · capped per tx and per day</text></g>
<g><rect x="1030" y="490" width="210" height="96" rx="12" fill="#111b24" stroke="#34d399" stroke-width="2"/><text x="1135.0" y="534.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#e6edf3">Cold vault</text><text x="1135.0" y="558.0" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#8b98a5">about 85% · locked until 20 Nov</text></g>
<line x1="270" y1="538" x2="350" y2="538" stroke="#34d399" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/></line><line x1="600" y1="538" x2="680" y2="538" stroke="#34d399" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/></line><line x1="950" y1="538" x2="1030" y2="538" stroke="#34d399" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="36;0" dur="1.2s" repeatCount="indefinite"/></line>
</svg>
